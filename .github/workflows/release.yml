# Release publication is deliberately manual and bound to a tested main commit.
# The input selects the checked-in version; it never rewrites files or commits changes.
name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Checked-in SemVer, without v (for example 2.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate release request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-repository.mjs $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'release version validation failed' }
          node scripts/check-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'release preflight failed' }
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Rust setup failed' }
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Check, test and package
        run: ./scripts/verify.ps1 -Version $env:RELEASE_VERSION -Build
      - name: Retain verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VibranceGUIv2-${{ inputs.version }}-windows-x64
          path: |
            artifacts/VibranceGUIv2_*_x64-portable.exe
            artifacts/VibranceGUIv2_*_x64-setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/LICENSE.txt
            artifacts/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish release for verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'final release preflight failed' }
          $tag = "v$env:RELEASE_VERSION"
          $assets = @(
            "artifacts/VibranceGUIv2_$($env:RELEASE_VERSION)_x64-portable.exe",
            "artifacts/VibranceGUIv2_$($env:RELEASE_VERSION)_x64-setup.exe",
            'artifacts/SHA256SUMS.txt',
            'artifacts/LICENSE.txt',
            'artifacts/THIRD-PARTY-LICENSES.txt'
          )
          $notes = @"
          Windows x64 release built from commit $env:GITHUB_SHA after Windows CI and release validation.

          Download the setup executable for installation, or the portable executable for an existing WebView2 installation. Both executables are currently unsigned.

          Digital vibrance requires a supported NVIDIA or AMD display driver. Brightness and gamma target SDR displays; HDR and driver/game color overrides can prevent the requested effect. See the compatibility notes in the repository README.

          SHA256SUMS.txt lists the SHA-256 hashes of the binaries and license notices. This release does not include the original VibranceGUI sources or driver binaries.
          "@
          Set-Content -LiteralPath artifacts/release-notes.md -Value $notes -Encoding utf8NoBOM
          $arguments = @('release', 'create', $tag) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "VibranceGUI v$env:RELEASE_VERSION",
            '--notes-file', 'artifacts/release-notes.md',
            '--draft'
          )
          if ($env:RELEASE_VERSION.Split('+')[0].Contains('-')) { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'release draft or asset upload failed; inspect the draft before retrying' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'release publication failed; the draft and verified assets remain available' }
